<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>무드월 전광판 · 상시 화면</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&amp;family=Noto+Sans+KR:wght@500;700;900&amp;display=swap">
<style>
body{margin:0}
a{color:#3D7BFF}a:hover{color:#2A5FD6}
@keyframes mwDrift{from{transform:translate3d(0,0,0)}to{transform:translate3d(3400px,0,0)}}
@keyframes mwRainFall{from{transform:translate3d(0,-120px,0) rotate(12deg)}to{transform:translate3d(-190px,900px,0) rotate(12deg)}}
@keyframes mwSnowFall{from{transform:translate3d(0,-40px,0)}to{transform:translate3d(0,860px,0)}}
@keyframes mwSway{0%,100%{transform:translate3d(-18px,0,0)}50%{transform:translate3d(18px,0,0)}}
@keyframes mwGlow{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.08);opacity:1}}
@keyframes mwTwinkle{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes mwBolt{0%,88%,91%,93.5%,100%{opacity:0}89%,92.5%{opacity:1}}
@keyframes mwFlash{0%,88%,91%,93.5%,100%{opacity:0}89%,92.5%{opacity:.22}}
@keyframes mwDriftFar{from{transform:translate3d(0,0,0)}to{transform:translate3d(4000px,0,0)}}
div,p,h1,span{transition: background-color 4s ease, color 4s ease, border-color 4s ease}
@keyframes mwBob{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(0,-14px,0)}}
</style>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
#mw-host{position:absolute;transform-origin:0 0;width:2400px;height:800px}
#mw-ctl{position:fixed;right:12px;bottom:12px;z-index:99;display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:rgba(20,22,27,.85);color:#fff;font:14px system-ui,sans-serif}
#mw-ctl select,#mw-ctl button{font:inherit;padding:4px 6px;border-radius:6px}
body.kiosk #mw-ctl{display:none}
</style>
</head>
<body>
<template id="mw-template">

<div style="width: 2400px; height: 800px; position: relative; overflow: hidden; background: {{t.bg}}; color: {{t.ink}}; font-family: 'Noto Sans KR', system-ui, sans-serif; box-sizing: border-box">

  <div aria-hidden="true" style="position: absolute; inset: 0; z-index: 0; background: linear-gradient(180deg, {{sk.dayTop}} 0%, {{sk.dayBot}} 100%); opacity: {{sk.dayOp}}; transition: opacity 3s ease"></div>
  <div aria-hidden="true" style="position: absolute; inset: 0; z-index: 0; background: linear-gradient(180deg, {{sk.duskTop}} 0%, {{sk.duskBot}} 100%); opacity: {{sk.duskOp}}; transition: opacity 3s ease"></div>
  <div aria-hidden="true" style="position: absolute; inset: 0; z-index: 0; background: linear-gradient(180deg, {{sk.nightTop}} 0%, {{sk.nightBot}} 100%); opacity: {{sk.nightOp}}; transition: opacity 3s ease"></div>
  <div aria-hidden="true" style="position: absolute; inset: 0; z-index: 0; overflow: hidden; pointer-events: none">
    <sc-if value="{{fx.sun}}" hint-placeholder-val="{{ true }}">
      <div style="position: absolute; inset: 0; opacity: {{sk.sunOp}}; transition: opacity 3s ease">
      <div style="position: absolute; left: 1380px; top: -360px; width: 760px; height: 760px; border-radius: 50%; background: radial-gradient(circle, rgba(255,248,214,0.95) 0%, rgba(255,236,170,0.55) 22%, rgba(255,236,170,0.18) 45%, rgba(255,236,170,0) 70%); animation: mwGlow 8s ease-in-out infinite"></div>
      </div>
    </sc-if>
    <sc-if value="{{fx.stars}}" hint-placeholder-val="{{ false }}">
      <div style="position: absolute; inset: 0; opacity: {{sk.starOp}}; transition: opacity 3s ease">
      <sc-for list="{{stars}}" as="p" hint-placeholder-count="40">
        <div style="position: absolute; left: {{p.x}}; top: {{p.y}}; width: {{p.s}}; height: {{p.s}}; border-radius: 50%; background: #FFFFFF; animation: mwTwinkle {{p.dur}} ease-in-out {{p.delay}} infinite"></div>
      </sc-for>
      </div>
    </sc-if>
    <sc-if value="{{fx.overcast}}" hint-placeholder-val="{{ false }}">
      <sc-for list="{{greys}}" as="g" hint-placeholder-count="5">
        <div style="position: absolute; left: -1500px; top: {{g.top}}; width: {{g.w}}; height: {{g.h}}; opacity: {{g.op}}; animation: mwDriftFar {{g.dur}} linear {{g.delay}} infinite">
          <svg viewBox="{{g.vb}}" preserveAspectRatio="none" width="100%" height="100%" aria-hidden="true"><path d="{{g.d}}" fill="{{g.fill}}"></path></svg>
        </div>
      </sc-for>
    </sc-if>
    <sc-if value="{{fx.rain}}" hint-placeholder-val="{{ false }}">
      <sc-for list="{{drops}}" as="p" hint-placeholder-count="60">
        <div style="position: absolute; left: {{p.x}}; top: 0; width: 3px; height: {{p.len}}; border-radius: 3px; background: linear-gradient(180deg, rgba(255,255,255,0) 0%, rgba(235,244,255,0.75) 100%); animation: mwRainFall {{p.dur}} linear {{p.delay}} infinite"></div>
      </sc-for>
    </sc-if>
    <sc-if value="{{fx.snow}}" hint-placeholder-val="{{ false }}">
      <sc-for list="{{flakes}}" as="p" hint-placeholder-count="60">
        <div style="position: absolute; left: {{p.x}}; top: 0; animation: mwSnowFall {{p.dur}} linear {{p.delay}} infinite">
          <div style="width: {{p.s}}; height: {{p.s}}; border-radius: 50%; background: #FFFFFF; box-shadow: 0 0 6px rgba(70,90,120,0.35); opacity: {{p.op}}; animation: mwSway {{p.sway}} ease-in-out infinite"></div>
        </div>
      </sc-for>
    </sc-if>
    <sc-if value="{{fx.storm}}" hint-placeholder-val="{{ false }}">
      <svg viewBox="0 0 120 420" width="150" height="525" aria-hidden="true" style="position: absolute; left: 1640px; top: -20px; animation: mwBolt 7s linear infinite; filter: drop-shadow(0 0 18px rgba(255,250,210,0.9))"><path d="M70 0 L28 190 L62 190 L22 420 L104 150 L66 150 L96 0 Z" fill="#FFF7C8"></path></svg>
      <svg viewBox="0 0 120 420" width="90" height="315" aria-hidden="true" style="position: absolute; left: 980px; top: -10px; animation: mwBolt 11s linear 3.5s infinite; filter: drop-shadow(0 0 14px rgba(255,250,210,0.9))"><path d="M70 0 L28 190 L62 190 L22 420 L104 150 L66 150 L96 0 Z" fill="#FFF7C8"></path></svg>
      <div style="position: absolute; inset: 0; background: #FFFFFF; animation: mwFlash 7s linear infinite"></div>
    </sc-if>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; z-index: 0">
    <sc-for list="{{bubbles}}" as="b" hint-placeholder-count="14">
      <div style="position: absolute; left: -800px; top: {{b.top}}; animation: mwDrift {{b.dur}} linear {{b.delay}} infinite; will-change: transform">
        <div style="position: relative; width: {{b.w}}; height: {{b.h}}; font-size: {{b.size}}; opacity: {{b.op}}; filter: drop-shadow(0 6px 10px {{b.shadow}}); will-change: transform; animation: mwBob {{b.bob}} ease-in-out infinite">
          <svg viewBox="{{b.vb}}" preserveAspectRatio="none" width="100%" height="100%" aria-hidden="true" style="position: absolute; inset: 0; transform: {{b.flip}}"><defs><radialGradient id="{{b.gid}}" cx="{{b.gcx}}" cy="{{b.gcy}}" r="0.6"><stop offset="0" stop-color="{{b.g2}}"></stop><stop offset="0.5" stop-color="{{b.g2}}"></stop><stop offset="1" stop-color="{{b.g1}}"></stop></radialGradient></defs><path d="{{b.d}}" fill="url(#{{b.gid}})"></path></svg>
          <div style="position: absolute; left: {{b.tl}}; width: {{b.tw}}; top: {{b.ty}}; transform: translateY(-50%); text-align: center; color: {{b.ink}}; font-weight: 500; white-space: nowrap; line-height: 1.3">{{b.emoji}} {{b.text}}</div>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="position: relative; z-index: 1; height: 100%; box-sizing: border-box; padding: 48px; display: flex; flex-direction: row; gap: 40px">

    <div style="width: 440px; flex-shrink: 0; background: {{t.panel}}; border-radius: 36px; padding: 40px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px">
      <div style="font-size: 22px; font-weight: 900; letter-spacing: 0.2em; color: {{t.sub}}">MOOD WALL</div>
      <h1 style="margin: 0; font-family: 'Jua', 'Noto Sans KR', sans-serif; font-weight: 400; font-size: 56px; line-height: 1.2; color: {{t.ink}}">오늘 기분,<br>한 줄로 남겨요</h1>
      
      <p style="margin: 0; font-size: 24px; line-height: 1.5; color: {{t.sub}}"><br></p><div style="width: 355px; height: 344px; border-radius: 24px; border: 4px dashed {{t.line}}; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 700; color: {{t.sub}}">QR 코드</div>
    </div>

    <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; justify-content: space-between; padding: 16px 24px; box-sizing: border-box">
      <div style="display: flex; flex-direction: row; justify-content: space-between; align-items: flex-start; gap: 24px">
        <div style="display: flex; flex-direction: column; gap: 12px">
          <div style="font-size: 28px; font-weight: 700; color: {{sk.sub}}">{{dateText}}</div>
          <div style="font-family: 'Jua', 'Noto Sans KR', sans-serif; font-size: 84px; line-height: 1.15; color: {{sk.ink}}">오늘 {{total}}개의 구름이<br>모였어요</div>
        </div>
        <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 8px">
          <div style="font-size: 64px; font-weight: 900; line-height: 1.1; color: {{sk.ink}}">{{timeText}}</div>
          <div style="font-size: 48px; font-weight: 900; line-height: 1.1; color: {{sk.ink}}">{{tempText}}</div>
        </div>
      </div>
      
    </div>

    <div style="width: 520px; flex-shrink: 0; background: {{t.panel}}; border-radius: 36px; padding: 40px; box-sizing: border-box; display: flex; flex-direction: column; gap: 22px">
      <div style="font-size: 22px; font-weight: 900; letter-spacing: 0.2em; color: {{t.sub}}">오늘의 무드 예보</div>
      <div style="display: flex; flex-direction: row; align-items: center; gap: 18px">
        <svg viewBox="0 0 24 24" width="64" height="64" fill="none" stroke="{{t.ink}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 18h10a4 4 0 0 0 .5-7.97A6 6 0 0 0 6.1 11.2 3.5 3.5 0 0 0 7 18z"></path></svg>
        <div style="font-family: 'Jua', 'Noto Sans KR', sans-serif; font-size: 50px; line-height: 1.15; color: {{t.ink}}">{{weather}}</div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 14px; margin-top: 6px">
        <sc-for list="{{stats}}" as="s" hint-placeholder-count="7">
          <div style="display: grid; grid-template-columns: 80px minmax(0, 1fr) 64px; align-items: center; gap: 14px">
            <div style="font-size: 26px; font-weight: 700; color: {{s.ink}}">{{s.label}}</div>
            <div style="height: 22px; border-radius: 999px; background: {{s.track}}; overflow: hidden">
              <div style="height: 100%; width: {{s.width}}; border-radius: 999px; background: {{s.color}}"></div>
            </div>
            <div style="font-size: 24px; font-weight: 700; text-align: right; color: {{s.sub}}">{{s.pct}}</div>
          </div>
        </sc-for>
      </div>
      
    </div>

  </div>
</div>
</template>
<div id="mw-host"></div>
<div id="mw-ctl"><label>theme <select onchange="mwSetProp('theme',this.value)"><option selected>낮</option><option>밤</option></select></label><label>weather <select onchange="mwSetProp('weather',this.value)"><option selected>맑음</option><option>흐림</option><option>비</option><option>눈</option><option>뇌우</option></select></label><button onclick="this.parentNode.remove()">닫기</button></div>

    return {

      fx: fxv.fx, stars: fxv.stars, greys: fxv.greys, drops: fxv.drops, flakes: fxv.flakes, tempText: MW_SKY[wk].temp,

  }
}

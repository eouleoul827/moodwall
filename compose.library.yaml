# Library laptop = the server. Apply after compose.yaml, compose.frontend.yaml and
# compose.gemini.yaml (add compose.gemini-emotion.yaml for local emotion colours).
#
# Students' phones (LTE/5G or any Wi-Fi) reach the laptop through Tailscale Funnel,
# installed on Windows itself (not a container). It gives the laptop a fixed, free
# HTTPS address https://<machine>.<tailnet>.ts.net, renews its certificate by itself
# and forwards to the API on 127.0.0.1:8000. No inbound port is opened on the school
# network and the API keeps listening on 127.0.0.1 only. One-time setup:
#   tailscale funnel --bg 8000      (admin PowerShell; the setting survives reboots)
#
# One address everywhere: MOODWALL_PUBLIC_ORIGIN in .env is that ts.net address, the
# QR points to it, and the display launcher opens the wall through the same address.
# Never open the wall via http://localhost:8000: every POST would fail the origin
# check. See docs/library-laptop-operation.md.
services:
  api:
    environment:
      MOODWALL_ENVIRONMENT: production
  worker:
    environment:
      MOODWALL_ENVIRONMENT: production

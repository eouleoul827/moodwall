[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "moodwall-backend"
version = "0.1.0"
description = "QR admission, moderated school mood wall, and display control"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.162.0", "uvicorn==0.54.0", "psycopg[binary,pool]==3.3.6",
  "procrastinate==3.10.0", "pydantic-settings==2.16.2", "PyJWT==2.15.1",
  "argon2-cffi==25.1.0", "regex==2026.9.29", "alembic==1.20.1", "sqlalchemy==2.1.6",
]

[project.optional-dependencies]
test = ["pytest==9.2.0", "pytest-asyncio==1.4.1", "httpx==0.28.1", "jsonschema==4.26.0", "ruff==0.17.3"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "inference*"]

[tool.setuptools.package-data]
app = ["resources/*.json", "alembic.ini", "migrations/*.py", "migrations/versions/*.py", "migrations/versions/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: requires an isolated PostgreSQL test database"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
